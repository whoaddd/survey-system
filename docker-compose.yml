services:
  mysql:
    image: mysql:8.0
    container_name: survey-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - survey-net

  redis:
    image: redis:latest
    container_name: survey-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    networks:
      - survey-net

  minio:
    image: rancher/minio-minio:RELEASE.2020-07-13T18-09-56Z
    container_name: survey-minio
    command: server /data   # 不要加 --console-address
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}   # 旧版使用 ACCESS_KEY / SECRET_KEY
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API 与控制台共用 9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      retries: 5
    networks:
      - survey-net

  nacos:
    image: nacos/nacos-server:latest
    container_name: survey-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - survey-net

  web:
    build: ./frontend
    container_name: survey-web
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nacos
    networks:
      - survey-net

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nacos-data:

networks:
  survey-net:
    driver: bridge